name: Cassandre 0.24 source clock inspection
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cassandre-source-clock-inspection
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download original GPL source and inspect clock code
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 30 --max-time 180 'https://downloads.sourceforge.net/project/cassandre/cassandre/0.24/cassandre-0.24.SRC.tar.gz' -o cassandre-src.tar.gz
          mkdir src
          tar -xzf cassandre-src.tar.gz -C src
          echo "ARCHIVE_SHA256 $(sha256sum cassandre-src.tar.gz)"
          echo "SOURCE_FILES $(find src -type f | wc -l)"
          find src -type f | head -50
          grep -RniEI 'settime|timecontrol|timeleft|movetime|stopsearch|stop_search|timelimit|time_limit|\b(st|level|otim)\b|move now|clock|elapsed|starttime|endtime' src --include='*.cpp' --include='*.h' --include='*.c' --include='*.hpp' > clock_matches.txt || true
          echo "CLOCK_MATCH_LINES $(wc -l < clock_matches.txt)"
          head -160 clock_matches.txt
      - name: Preserve source inspection excerpt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cassandre-source-clock-matches
          path: clock_matches.txt
          retention-days: 30
