name: SF171 Depth1 vs Nodes1 1024T True Dual-Engine Preflight
on:
  push:
    branches: [experiment/sf171-depth1-vs-nodes1-variety100-20261018]
    paths: [".github/workflows/sf171-dual-engine-preflight.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dual-engine:
    runs-on: windows-2025
    timeout-minutes: 22
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: python -m pip install --quiet python-chess==1.999 psutil
      - name: Download original Stockfish 17.1 and preflight script
        shell: pwsh
        run: |
          $ProgressPreference='SilentlyContinue'
          New-Item -ItemType Directory -Force -Path experiments/sf171_oversub_windows | Out-Null
          $a='https://raw.githubusercontent.com/TanTzeHerng/chess-transformers-tth/experiment/sf171-depth1-vs-nodes1-variety100-20261018/experiments/sf171_oversub_windows/dual_engine_preflight.py'
          Invoke-WebRequest $a -OutFile experiments/sf171_oversub_windows/dual_engine_preflight.py -TimeoutSec 60
          Invoke-WebRequest 'https://github.com/official-stockfish/Stockfish/releases/download/sf_17.1/stockfish-windows-x86-64-avx2.zip' -OutFile stockfish.zip -TimeoutSec 180
          Expand-Archive stockfish.zip -DestinationPath dist -Force
          $exe=Get-ChildItem dist -File -Recurse | Where-Object {$_.Name -like '*stockfish*avx2*.exe'} | Select-Object -First 1
          if (!$exe) { throw 'Stockfish exe not found' }
          "STOCKFISH_BINARY=$($exe.FullName)" >> $env:GITHUB_ENV
      - name: Test simultaneous independent 1024-thread engines with default Hash and tablebase mirror
        shell: pwsh
        run: |
          python -u experiments/sf171_oversub_windows/dual_engine_preflight.py 2>&1 | Tee-Object dual_engine_console.log
          if ($LASTEXITCODE -ne 0) { throw "Dual-engine preflight could not satisfy requested settings" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sf171-dual-engine-preflight-${{ github.run_id }}
          path: |
            dual_engine_preflight.json
            dual_engine_console.log
          if-no-files-found: warn
