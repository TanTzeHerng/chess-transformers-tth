name: Cassandre XBoard 30-second clock diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cassandre-xboard-clock-diagnostic
  cancel-in-progress: false
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Retrieve and verify unmodified Cassandre 0.24
        shell: pwsh
        run: |
          curl.exe -fL --retry 3 --connect-timeout 30 --max-time 240 'https://downloads.sourceforge.net/project/cassandre/cassandre/0.24/cassandre-0.24.WIN32.zip' -o cassandre.zip
          if ($LASTEXITCODE -ne 0) { throw 'Cassandre download failed' }
          Expand-Archive cassandre.zip cassandre -Force
          $exe=Get-ChildItem cassandre -Filter cassandre.exe -Recurse -File | Select-Object -First 1
          if (-not $exe) { throw 'Missing original Cassandre executable' }
          $sha=(Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '17d69f321244ab1f6530341b9207fe32fd415e80e017e6c33a827c84755839b7') { throw 'Unexpected Cassandre binary SHA256' }
          Add-Content -Path $env:GITHUB_ENV -Value "CASSANDRE_EXE=$($exe.FullName)"
      - name: Compare equivalent XBoard 30-second clock controls without scoring
        shell: pwsh
        run: |
          @'
          import os,subprocess,threading,queue,time,json,pathlib
          exe=pathlib.Path(os.environ['CASSANDRE_EXE'])
          fen='rnbqkb1r/p2p2pp/5p2/2n1p3/2B5/N1R2Q2/2PP1PPP/2B1K1NR w Kkq - 0 13'
          def probe(mode):
              p=subprocess.Popen([str(exe)],cwd=str(exe.parent),stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,bufsize=1,encoding='utf-8',errors='replace')
              q=queue.Queue()
              def reader():
                  for s in p.stdout:q.put((time.monotonic(),s.strip()))
              threading.Thread(target=reader,daemon=True).start()
              events=[]; t0=time.monotonic()
              def send(s):
                  p.stdin.write(s+'\n');p.stdin.flush()
                  events.append({'at':round(time.monotonic()-t0,3),'send':s})
              try:
                  for s in ['xboard','protover 2','new','force','setboard '+fen]:send(s)
                  if mode=='st30':
                      send('st 30')
                  elif mode=='level30':
                      send('level 1 0:30 0')
                      send('time 3000')
                      send('otim 3000')
                  else:raise ValueError(mode)
                  t0=time.monotonic();send('go')
                  deadline=t0+80
                  stopped=False;found=None
                  while time.monotonic()<deadline:
                      now=time.monotonic()
                      if not stopped and now-t0>=30:
                          send('?');stopped=True
                      try:when,line=q.get(timeout=min(.25,max(.01,deadline-now)))
                      except queue.Empty:
                          if p.poll() is not None:break
                          continue
                      if line.startswith('move '):
                          found={'at':round(when-t0,3),'move':line.split()[1]}
                          events.append({'at':round(when-t0,3),'recv':line[:160]})
                          break
                      if line.startswith('feature ') or ('\t' in line and line[0].isdigit()):
                          events.append({'at':round(when-t0,3),'recv':line[:160]})
                  return {'mode':mode,'move':found,'events':events[-45:],'engine_sha256':'17d69f321244ab1f6530341b9207fe32fd415e80e017e6c33a827c84755839b7','scored':False}
              finally:
                  try:send('quit')
                  except Exception:pass
                  try:p.wait(timeout=2)
                  except Exception:
                      p.kill();p.wait(timeout=5)
          out=[probe('st30'),probe('level30')]
          pathlib.Path('xboard-clock-probe.json').write_text(json.dumps(out,indent=2),encoding='utf8')
          for r in out:print('CLOCK_PROBE',json.dumps({'mode':r['mode'],'move':r['move'],'tail':r['events'][-10:],'scored':False}),flush=True)
          '@ | Set-Content -Path probe.py -Encoding UTF8
          python -u probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve diagnostic only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cassandre-xboard-clock-diagnostic
          path: xboard-clock-probe.json
          retention-days: 30
