name: Build and test Rahul Transformer UCI
on:
  push:
    branches:
      - chatgpt/rahul-transformer-uci-20261001
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Rehydrate sources
        shell: pwsh
        run: |
          python -c "import gzip,base64;open('engine.cpp','wb').write(gzip.decompress(base64.b64decode('')))"
          python -c "import gzip,base64;open('convert_weights.py','wb').write(gzip.decompress(base64.b64decode('')))"
          python -c "import gzip,base64;open('policy_reference.py','wb').write(gzip.decompress(base64.b64decode('')))"
          python -c "import gzip,base64;open('smoke_test.py','wb').write(gzip.decompress(base64.b64decode('')))"
          python -c "import gzip,base64;open('match_test.py','wb').write(gzip.decompress(base64.b64decode('')))"

      - name: Install Python test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install python-chess
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Download pinned source and model
        shell: pwsh
        run: |
          curl.exe -L --retry 3 "https://raw.githubusercontent.com/Disservin/chess-library/v0.9.4/include/chess.hpp" -o chess.hpp
          curl.exe -L --retry 3 "https://huggingface.co/spaces/Rahul7777/chess-engine-transformer/resolve/main/chess_model_trained.pt?download=true" -o chess_model_trained.pt
          Get-FileHash chess_model_trained.pt -Algorithm SHA256

      - name: Convert exact checkpoint
        shell: pwsh
        run: |
          python convert_weights.py chess_model_trained.pt weights.bin

      - name: Compile Windows executable
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /O2 /EHsc /DNDEBUG /arch:AVX2 /Fe:RahulTransformerUCI_base.exe engine.cpp
          cmd /c "copy /b RahulTransformerUCI_base.exe+weights.bin RahulTransformerUCI.exe"
          if (!(Test-Path RahulTransformerUCI.exe)) { throw "EXE was not produced" }
          Get-FileHash RahulTransformerUCI.exe -Algorithm SHA256 | Format-List | Out-File exe_sha256.txt

      - name: Exact policy parity tests
        shell: pwsh
        run: |
          python policy_reference.py chess_model_trained.pt .\RahulTransformerUCI.exe | Tee-Object -FilePath policy_parity.txt

      - name: UCI protocol and search smoke tests
        shell: pwsh
        run: |
          python smoke_test.py .\RahulTransformerUCI.exe | Tee-Object -FilePath smoke_test.txt

      - name: Download benchmark opponents
        shell: pwsh
        run: |
          curl.exe -L --retry 3 "https://github.com/LeelaChessZero/lc0/releases/download/v0.32.1/lc0-v0.32.1-windows-cpu-openblas.zip" -o lc0.zip
          Expand-Archive -Force lc0.zip lc0pkg
          $lc0 = (Get-ChildItem -Recurse lc0pkg -Filter lc0.exe | Select-Object -First 1).FullName
          if (!$lc0) { throw "lc0.exe not found" }
          Set-Content lc0_path.txt $lc0
          curl.exe -L --retry 3 "https://raw.githubusercontent.com/CallOn84/LeelaNets/main/Nets/Elite%20Leela/Elite-Leela-v2-128x10x8h-1704000.pb.gz" -o elite_v2.pb.gz
          curl.exe -L --retry 3 "https://github.com/CSSLab/maia-chess/releases/download/v1.0/maia-1100.pb.gz" -o maia-1100.pb.gz
          Get-Item elite_v2.pb.gz,maia-1100.pb.gz | Format-Table Name,Length

      - name: Matches vs Elite Leela v2 and Maia 1100 at one node
        shell: pwsh
        run: |
          $lc0 = Get-Content lc0_path.txt
          python match_test.py .\RahulTransformerUCI.exe "$lc0" .\elite_v2.pb.gz .\maia-1100.pb.gz .\test-results | Tee-Object -FilePath match_console.txt

      - name: Package deliverable
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deliverable | Out-Null
          Copy-Item RahulTransformerUCI.exe deliverable\ -ErrorAction SilentlyContinue
          Copy-Item engine.cpp deliverable\RahulTransformerUCI-source.cpp
          Copy-Item exe_sha256.txt,policy_parity.txt,smoke_test.txt,match_console.txt deliverable\ -ErrorAction SilentlyContinue
          if (Test-Path test-results) { Copy-Item -Recurse test-results deliverable\test-results }
          @"
          Rahul Transformer UCI 1.0
          =========================
          Windows x64 UCI engine based on Rahul7777/chess-engine-transformer.

          Pure policy compatibility:
            go nodes 1
            go depth 1

          Search limits:
            go depth N
            go nodes N
            go movetime MS
            go wtime ... btime ... winc ... binc ... [movestogo N]
            go infinite / stop
            go searchmoves ...

          Model checkpoint SHA-256:
          37cf5871dfb006b9d053c1853234f1161bde832485e0c6f03122e2df66a1a0fd

          The original transformer is policy-only. At depths > 1 this wrapper uses
          transformer root-policy ordering plus alpha-beta, a transposition table,
          a deterministic classical leaf evaluator, and quiescence search.

          UCI options:
            Hash (1..1024 MB, default 64)
            Clear Hash

          The executable embeds the converted checkpoint, so no Python or PyTorch
          installation is needed to run it.
          "@ | Set-Content deliverable\README.txt
          Compress-Archive -Force deliverable\* RahulTransformerUCI-1.0-Windows-x64.zip

      - name: Upload tested executable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RahulTransformerUCI-1.0-Windows-x64
          path: |
            RahulTransformerUCI-1.0-Windows-x64.zip
            deliverable
          if-no-files-found: error
          retention-days: 7
