name: Cassandre native move-now deadline probe (unscored)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cassandre-xboard-move-now-probe-20261027
  cancel-in-progress: false
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install chess legality checker
        run: python -m pip install --quiet python-chess==1.999
      - name: Download pinned unscored probe without checkout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path experiments -Force | Out-Null
          curl.exe -fL --retry 3 --connect-timeout 30 --max-time 120 'https://raw.githubusercontent.com/TanTzeHerng/chess-transformers-tth/7d8bd458dd55442e4545413d74c499367719faca/experiments/cassandre_xboard_move_now_probe_20261027.py' -o experiments/cassandre_xboard_move_now_probe_20261027.py
          if ($LASTEXITCODE -ne 0) { throw 'Pinned probe download failed' }
          python -m py_compile experiments/cassandre_xboard_move_now_probe_20261027.py
      - name: Download and verify original Cassandre 0.24
        shell: pwsh
        run: |
          curl.exe -fL --retry 4 --connect-timeout 30 --max-time 300 'https://downloads.sourceforge.net/project/cassandre/cassandre/0.24/cassandre-0.24.WIN32.zip' -o cassandre.zip
          if ($LASTEXITCODE -ne 0) { throw 'Original Cassandre download failed' }
          Expand-Archive cassandre.zip cassandre -Force
          $exe=Get-ChildItem cassandre -Filter cassandre.exe -Recurse -File | Select-Object -First 1
          if (-not $exe) { throw 'Original Cassandre binary missing' }
          $hash=(Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '17d69f321244ab1f6530341b9207fe32fd415e80e017e6c33a827c84755839b7') { throw 'Cassandre SHA mismatch' }
          Add-Content -Path $env:GITHUB_ENV -Value "CASSANDRE_EXE=$($exe.FullName)"
      - name: Probe native move-now command without scoring
        shell: pwsh
        run: |
          python -u experiments/cassandre_xboard_move_now_probe_20261027.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content cassandre-move-now-unscored.json
      - name: Preserve unscored diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cassandre-move-now-unscored
          path: cassandre-move-now-unscored.json
          retention-days: 30
          if-no-files-found: warn
