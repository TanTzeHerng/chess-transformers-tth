name: Measure Stockfish 17.1 1024-thread nodes per game
on:
  push:
    branches:
      - experiment/sf171-t1024-nodeaudit-20261014
    paths:
      - .github/workflows/sf171-t1024-nodeaudit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  match:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install chess-rule validator
        run: python -m pip install --disable-pip-version-check 'python-chess==1.999'
      - name: Copy chess validator into system-Python-compatible environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/chess_validator
          cp -a "$(python -c 'import chess; print(chess.__path__[0])')" /tmp/chess_validator/chess
          PYTHONPATH=/tmp/chess_validator /usr/bin/python3 -c 'import chess,chess.engine; print(chess.__version__)'
      - name: Download and verify Stockfish 17.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stockfish unpack
          curl --retry 5 --retry-delay 3 --connect-timeout 30 -fLSs \
            'https://github.com/official-stockfish/Stockfish/releases/download/sf_17.1/stockfish-ubuntu-x86-64-avx2.tar' \
            -o sf171.tar
          echo '09e953222dbe80aaea5c33dab265413b295cb8376418445c877708c61e31987d  sf171.tar' | sha256sum -c -
          tar -xf sf171.tar -C unpack
          BIN=$(find unpack -type f -name 'stockfish-ubuntu-x86-64-avx2' | head -1)
          test -n "$BIN"
          install -m 755 "$BIN" stockfish/stockfish-ubuntu-x86-64-avx2
          find unpack -type f -name '*.nnue' -exec cp -v {} stockfish/ \;
          printf 'uci\nquit\n' | stockfish/stockfish-ubuntu-x86-64-avx2 | grep -E 'Stockfish 17.1|option name Hash |option name MultiPV'
          rm -rf unpack sf171.tar
      - name: Validate match runner syntax before heavy setup
        run: python -m py_compile experiments/sf171_t1024_node_audit/runner.py
      - name: Download full 3-4-5 Syzygy tablebases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tablebases
          for mode in wdl dtz; do
            url="https://tablebase.lichess.ovh/tables/standard/3-4-5-${mode}/"
            timeout 1800 wget -q -nv -c -r -l1 -np -nd -e robots=off \
              --connect-timeout=15 --read-timeout=60 --tries=3 \
              -A "*.rtbw,*.rtbz" -P tablebases "$url"
          done
          test "$(find tablebases -maxdepth 1 -type f -name "*.rtbw" | wc -l)" -eq 145
          test "$(find tablebases -maxdepth 1 -type f -name "*.rtbz" | wc -l)" -eq 145
          du -sh tablebases
      - name: Measure actual nodes in two legal 1024-thread depth1 games
        run: PYTHONPATH=/tmp/chess_validator /usr/bin/python3 -u experiments/sf171_t1024_node_audit/runner.py
      - name: Preserve node log even if benchmark is interrupted
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sf171-t1024-depth1-node-audit
          path: node_audit_results/
          if-no-files-found: warn
          retention-days: 30
