name: ChessGPT 200 unique leaf final UCI defaults acceptance test
on:
  push:
    branches:
      - experiment/chessgpt-200-unique-defaults-20261014
    paths:
      - .github/workflows/chessgpt_mcts_final_defaults_test.yml
      - experiments/chessgpt_mcts_elite2/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: experiments/chessgpt_mcts_elite2
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "4"
      OMP_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
      CHESSGPT_INT8: "1"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download only experimental Python scripts
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p experiments/chessgpt_mcts_elite2
          root="https://raw.githubusercontent.com/TanTzeHerng/chess-transformers-tth/refs/heads/experiment/chessgpt-200-unique-defaults-20261014/experiments/chessgpt_mcts_elite2"
          for file in chessgpt_mcts_uci.py match.py; do
            curl -fL --retry 5 -o "experiments/chessgpt_mcts_elite2/$file" "$root/$file"
          done
          curl -fL --retry 5 -o experiments/chessgpt_mcts_elite2/cloud_match.py "https://raw.githubusercontent.com/TanTzeHerng/chess-transformers-tth/refs/heads/experiment/chessgpt-maia1900-promptfix-20261013/experiments/chessgpt_maia1900/cloud_match.py"
      - name: Install CPU-only torch
        run: |
          python -m pip install --no-cache-dir python-chess
          python -m pip install --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Download ChessGPT original checkpoint and model code
        run: |
          curl -fL --retry 5 -o model.py "https://raw.githubusercontent.com/adamkarvonen/train_ChessGPT/master/model.py"
          curl -fL --retry 6 -o stockfish_16layers_ckpt_with_optimizer.pt "https://huggingface.co/adamkarvonen/chess_llms/resolve/main/stockfish_16layers_ckpt_with_optimizer.pt"
          test "$(wc -c < stockfish_16layers_ckpt_with_optimizer.pt)" -eq 610803879
      - name: Install original Stockfish 16 Linux classical evaluator
        run: |
          mkdir -p stockfish16 sf16_download
          curl -fL --retry 5 -o sf16.tar "https://github.com/official-stockfish/Stockfish/releases/download/sf_16/stockfish-ubuntu-x86-64-avx2.tar"
          tar -xf sf16.tar -C sf16_download
          find sf16_download -type f | head -n 20
          sf=$(find sf16_download -type f -name '*stockfish*' ! -name '*.nnue' ! -name '*.md' ! -name '*.txt' | head -n 1)
          test -n "$sf"
          cp "$sf" stockfish16/stockfish-windows-x64-avx2.exe
          chmod +x stockfish16/stockfish-windows-x64-avx2.exe
          echo uci | stockfish16/stockfish-windows-x64-avx2.exe | head -n 12
      - name: Verify vectorized SAN probability equivalence with scalar ChessGPT
        run: |
          cat > equivalent.py <<'PY'
          import torch,chess
          from cloud_match import load_gpt,neural_step,make_prompt,STOI
          from chessgpt_mcts_uci import fast_neural_step,batched_san_costs
          m=load_gpt()
          b=chess.Board()
          for san in ['e4','e5','Nf3','Nc6']:b.push_san(san)
          prompt=make_prompt(b)
          root,kv=fast_neural_step(m,[STOI[c] for c in prompt])
          sans=[b.san(m) for m in b.legal_moves]
          scores=batched_san_costs(m,root,kv,sans,batch_size=16)
          for san,score in zip(sans,scores):
              t=prompt
              logp=0.0
              for ch in san+' ':
                  l,_=neural_step(m,[STOI[c] for c in t])
                  logp-=float(torch.log_softmax(l.float(),dim=-1)[STOI[ch]])
                  t+=ch
              assert abs(logp-score)<0.005,(san,logp,score)
          print('VECTORIZED_EQUIVALENCE_PASS',len(sans),'SAN legal probabilities',flush=True)
          PY
          python -u equivalent.py
      - name: Compare 2.5 and 5 second INT8 MCTS speed with batch64 and CPU threads4
        run: |
          python -m py_compile chessgpt_mcts_uci.py cloud_match.py
          cat > bench.py <<'PY'
          import sys,time,chess,chess.engine,re
          from pathlib import Path
          exe=[sys.executable,'-u',str(Path('chessgpt_mcts_uci.py').resolve())]
          boards=[('startpos',chess.Board())]
          mid=chess.Board()
          for san in ['e4','e5','Nf3','Nc6','Bb5','a6','Ba4','Nf6','O-O','Be7',
                      'Re1','b5','Bb3','d6','c3','O-O','h3','Nb8','d4','Nbd7']:
              mid.push_san(san)
          boards.append(('20ply',mid))
          # Create a legal 40-ply benchmark position. The Stockfish16 search
          # ONLY creates independent TEST INPUTS, never powers ChessGPT policy.
          deeper=mid.copy(stack=True)
          sfpath=Path('stockfish16/stockfish-windows-x64-avx2.exe').resolve()
          with chess.engine.SimpleEngine.popen_uci(str(sfpath)) as sf:
              sf.configure({'Use NNUE':False})
              for _ in range(20):
                  if deeper.is_game_over(claim_draw=True):break
                  result=sf.play(deeper,chess.engine.Limit(depth=1))
                  assert result.move in deeper.legal_moves
                  deeper.push(result.move)
          assert deeper.ply()>=38 and not deeper.is_game_over(claim_draw=True)
          boards.append(('40ply',deeper))
          print('BENCHMARK_40PLY_FEN',deeper.fen(),flush=True)
          configurations=[(24,800)]
          outcome=[]
          with chess.engine.SimpleEngine.popen_uci(exe,timeout=180) as eng:
              expected={'TorchThreads':4,'SANBatchSize':64,'CPuct':900,
                        'RootPolicyBeam':64,'ChildPolicyBeam':64,
                        'ExpandAfterVisits':24,'PolicyTemperature':800}
              for option,default in expected.items():
                  assert int(eng.options[option].default)==default,(option,eng.options[option].default)
              print('AUDITED_DEFAULTS_PASS',expected,flush=True)
              eng.configure({'FreshLeafBenchmark':True})
              # One-time PyTorch dispatch / kernel warm-up is outside the
              # per-move search clock; ucinewgame and FreshLeafBenchmark
              # both clear position-specific caches before measured runs.
              warmup=eng.play(chess.Board(),chess.engine.Limit(time=0.3),
                              info=chess.engine.INFO_ALL,game=object())
              print('WARMUP_COMPLETE',warmup.move,flush=True)
              for threshold,temp in configurations:
                  eng.configure({'ExpandAfterVisits':threshold,'PolicyTemperature':temp})
                  row={}
                  for label,board in boards:
                      start=time.monotonic()
                      r=eng.play(board,chess.engine.Limit(time=2.35),
                                 info=chess.engine.INFO_ALL,game=object())
                      wall=time.monotonic()-start
                      info=r.info.get('string','')
                      m=re.search(r'fresh_distinct_classical_leaf_evals (\d+)',info)
                      assert m,info
                      fresh=int(m.group(1))
                      row[label]=fresh
                      print('UNDER_2500MS',threshold,temp,label,'fresh_leaf_evals',
                            fresh,'wall_ms',round(wall*1000),
                            'nodes',r.info.get('nodes'),'stats',info,flush=True)
                      assert r.move in board.legal_moves
                      assert wall<2.5,('Wall clock exceeded exact 2500ms',wall)
                      assert fresh>=200,('Not enough fresh distinct classical leaf positions',label,fresh)
                  outcome.append((threshold,temp,row))
          print('BEST_CONFIG',max(outcome,key=lambda r:min(r[2].values())),flush=True)
          print('TIGHT_TIME_SWEEP_COMPLETE',flush=True)
          PY
          python -u bench.py
