name: SF17.1 EvalFile Depth1 1Thread Paired Variety 20261019
on:
  push:
    paths:
      - .github/workflows/evalfile-depth1-20261019.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install python-chess
        run: python -m pip install --quiet python-chess==1.999
      - name: Get unmodified Stockfish 17.1 and Variety
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p engine nets output
          curl -fL --retry 5 --retry-delay 4 --connect-timeout 30 --max-time 600 https://github.com/official-stockfish/Stockfish/releases/download/sf_17.1/stockfish-ubuntu-x86-64-avx2.tar -o stockfish171.tar
          tar -xf stockfish171.tar -C engine
          BIN="$(find engine -type f -name 'stockfish-ubuntu-x86-64-avx2' -print -quit)"
          if [[ -z "$BIN" ]]; then find engine -maxdepth 4 -type f; exit 1; fi
          chmod +x "$BIN"
          echo "STOCKFISH_BIN=$(realpath "$BIN")" >> "$GITHUB_ENV"
          curl -fL --retry 5 --retry-delay 4 --max-time 150 https://raw.githubusercontent.com/Avo-k/black_numba/master/book/Variety.bin -o Variety.bin
          echo "5a30bc27b5e7b7d51694bf35e7d5dd2536b54e9b25ea3ea64ef4a2b982d5e21c  Variety.bin" | sha256sum -c -
      - name: Download and verify candidate and baseline networks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures, hashlib, pathlib, time, urllib.request
          names = ["nn-1c0000000000.nnue", "nn-37f18f62d772.nnue",
                   "nn-1111cefa1111.nnue", "nn-1cedc0ffeeee.nnue",
                   "nn-31337bea577c.nnue", "nn-e8bac1c07a5a.nnue",
                   "nn-74f1d263ae9a.nnue", "nn-ddcfb9224cdb.nnue",
                   "nn-c721dfca8cd3.nnue", "nn-808259761cca.nnue",
                   "nn-a56cb8c3d477.nnue"]
          def download(n):
              u="https://tests.stockfishchess.org/api/nn/"+n
              for attempt in range(5):
                  try:
                      req=urllib.request.Request(u,headers={"User-Agent":"Stockfish17-EvalFile-Research"})
                      h=hashlib.sha256()
                      with urllib.request.urlopen(req,timeout=180) as r, open("nets/"+n,"wb") as f:
                          while True:
                              chunk=r.read(1024*1024)
                              if not chunk:break
                              f.write(chunk);h.update(chunk)
                      if h.hexdigest()[:12]!=n[3:15]:raise RuntimeError("SHA mismatch "+n)
                      print("SHA_OK",n,pathlib.Path("nets",n).stat().st_size,flush=True)
                      return
                  except Exception as ex:
                      if attempt==4:raise
                      print("RETRY",n,repr(ex),flush=True)
                      time.sleep(4)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              list(pool.map(download,names))
          PY
      - name: Run paired depth1 tournament, preserving all outcomes
        shell: bash
        run: |
          set -euo pipefail
          python -u experiments/evalfile_sf171_depth1_20261019.py --engine "$STOCKFISH_BIN" --nets nets --book Variety.bin --out output --pairs 100 --maxplies 260 2>&1 | tee output/console.log
      - name: Upload scores, PGNs and technical failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sf171-evalfile-depth1-1thread
          path: output/
          if-no-files-found: warn
          retention-days: 30
