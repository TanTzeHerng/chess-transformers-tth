name: Audit cloud disk for 128 GiB swap
on:
  push:
    branches:
      - experiment/sf171-hash64-vs-131072-20261014
    paths:
      - .github/workflows/hash-zram-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Measure unused cloud disk without deleting anything
        shell: bash
        run: |
          set -euo pipefail
          uname -r
          free -h
          df -h /
          for folder in /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/chromium /usr/local/share/boost /opt/az /usr/local/lib/node_modules /var/lib/docker /var/cache/apt; do
            if [ -d "$folder" ]; then sudo du -sh "$folder" || true; fi
          done
          sudo du -x -h -d1 /opt /usr/local /usr/share /var/lib 2>/dev/null | sort -h | tail -25
          echo 'AUDIT COMPLETE WITHOUT FILE MODIFICATIONS'
