name: Probe 118 GiB cloud disk-backed swap
on:
  push:
    branches:
      - experiment/sf171-hash64-vs-131072-20261014
    paths:
      - .github/workflows/hash-zram-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Reclaim unused runner tools and provision cloud swap
        shell: bash
        run: |
          set -euxo pipefail
          echo INITIAL
          df -h /
          free -h
          sudo du -x -h -d1 /opt /usr/local /usr/share /var/lib 2>/dev/null | sort -h | tail -35
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache /opt/ghc /usr/local/.ghcup
          sudo rm -rf /usr/local/share/powershell /usr/local/share/chromium /usr/local/share/boost
          sudo rm -rf /opt/az /usr/local/lib/node_modules /var/lib/docker
          sudo apt-get clean
          echo AFTER_CLEANUP
          df -h /
          free -h
          sudo fallocate -l 118G /swap_large
          sudo chmod 600 /swap_large
          sudo mkswap /swap_large
          sudo swapon -p 100 /swap_large
          echo SUCCESS
          free -h
          swapon --show
