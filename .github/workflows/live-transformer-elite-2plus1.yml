name: Live Transformer vs Elite v2 2+1
on:
  push:
    branches:
      - chatgpt/rahul-transformer-uci-20261001
    paths:
      - .github/workflows/live-transformer-elite-2plus1.yml

permissions:
  contents: write
  actions: read

jobs:
  match:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install match driver dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install python-chess

      - name: Download tested Transformer engine
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 36886272220 --repo ${{ github.repository }} -n RahulTransformerUCI-1.0-Windows-x64 -D artifact
          $engine = (Get-ChildItem -Recurse artifact -Filter RahulTransformerUCI.exe | Select-Object -First 1).FullName
          if (!$engine) { throw "Transformer executable not found" }
          Set-Content transformer_path.txt $engine

      - name: Download Elite Leela v2 and Lc0
        shell: pwsh
        run: |
          curl.exe -L --retry 3 "https://github.com/LeelaChessZero/lc0/releases/download/v0.32.1/lc0-v0.32.1-windows-cpu-openblas.zip" -o lc0.zip
          Expand-Archive -Force lc0.zip lc0pkg
          $lc0 = (Get-ChildItem -Recurse lc0pkg -Filter lc0.exe | Select-Object -First 1).FullName
          if (!$lc0) { throw "lc0.exe not found" }
          Set-Content lc0_path.txt $lc0
          curl.exe -L --retry 3 "https://raw.githubusercontent.com/CallOn84/LeelaNets/main/Nets/Elite%20Leela/Elite-Leela-v2-128x10x8h-1704000.pb.gz" -o elite_v2.pb.gz
          if ((Get-Item elite_v2.pb.gz).Length -lt 1000000) { throw "Elite v2 net download invalid" }

      - name: Fetch live match script
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/contents/ci-live/live_match.py?ref=${{ github.ref_name }}" --jq .content | Out-File script.b64 -Encoding ascii
          python -c "import base64;open('live_match.py','wb').write(base64.b64decode(open('script.b64').read()))"

      - name: Play live match
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $engine = Get-Content transformer_path.txt
          $lc0 = Get-Content lc0_path.txt
          python live_match.py "$engine" "$lc0" ".\elite_v2.pb.gz"

      - name: Upload PGN
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Transformer-vs-Elite-v2-2plus1
          path: Transformer-vs-Elite-v2-2plus1.pgn
          if-no-files-found: warn
          retention-days: 7
