name: Independent Stockfish17.1 ChessGPT-Elite drawn position audit
on:
  push:
    branches:
      - analysis/chessgpt-draw-positions-20261014
    paths:
      - .github/workflows/chessgpt_elite_draws_audit.yml
      - experiments/chessgpt_mcts_elite2/analyze_draws.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download independently validated real PGN artifacts from BOTH matches
        shell: bash
        run: |
          mkdir -p t1 t8
          gh run download 38487082810 -R TanTzeHerng/chess-transformers-tth --name chessgpt-native-policy-t1-variety-elite20-2plus1 --dir t1
          gh run download 38482960528 -R TanTzeHerng/chess-transformers-tth --name chessgpt-200fresh-elite20-variety-2plus1 --dir t8
          for d in t1 t8; do
            test -s "$d/ChessGPT_MCTS_vs_Elite_v2.pgn"
            test -s "$d/score.csv"
          done
      - name: Install PGN parser and independently strong Stockfish 17.1
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check python-chess
          curl -fL --retry 5 -o stockfish17.tar "https://github.com/official-stockfish/Stockfish/releases/download/sf_17.1/stockfish-ubuntu-x86-64-avx2.tar"
          mkdir -p sf_release
          tar -xf stockfish17.tar -C sf_release
          find sf_release -type f | head -n 20
          engine=$(find sf_release -type f -name 'stockfish-ubuntu-x86-64-avx2' | head -n 1)
          test -n "$engine"
          cp "$engine" stockfish_binary
          chmod +x stockfish_binary
          printf 'uci\nquit\n' | ./stockfish_binary | head -n 16
      - name: Compute actual positional evaluations for each claimed draw
        shell: bash
        run: |
          curl -fL --retry 5 -o analyze_draws.py "https://raw.githubusercontent.com/TanTzeHerng/chess-transformers-tth/refs/heads/analysis/chessgpt-draw-positions-20261014/experiments/chessgpt_mcts_elite2/analyze_draws.py"
          python -u analyze_draws.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chessgpt-elite-independent-sf171-draw-evaluations
          path: draw_eval_results.json
          if-no-files-found: ignore
