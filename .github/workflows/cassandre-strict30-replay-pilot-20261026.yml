name: Cassandre strict30 replay pilot (unscored)
on:
  workflow_dispatch:
    inputs:
      skip_puzzles:
        description: 'Number of manifest entries to skip; first eight already piloted'
        type: number
        required: true
        default: 8
      max_puzzles:
        description: 'Unscored puzzles to test in this batch'
        type: number
        required: true
        default: 16
permissions:
  actions: read
  contents: read
concurrency:
  group: cassandre-strict30-replay-pilot-20261026
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cassandre-2300-prepared
          run-id: 39586706185
          github-token: ${{ github.token }}
          path: dataset
      - uses: actions/download-artifact@v4
        with:
          name: cassandre-time-integrity-audit
          run-id: 40254577376
          github-token: ${{ github.token }}
          path: audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install chess move legality checker
        run: python -m pip install --quiet python-chess==1.999
      - name: Download pinned strict-time pilot script without checkout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path experiments -Force | Out-Null
          curl.exe -fL --retry 3 --connect-timeout 30 --max-time 120 'https://raw.githubusercontent.com/TanTzeHerng/chess-transformers-tth/668b1fbb16acbe7373725e4463554ae449a259c6/experiments/cassandre_strict30_replay_pilot_20261026.py' -o experiments/cassandre_strict30_replay_pilot_20261026.py
          if ($LASTEXITCODE -ne 0) { throw 'Pinned script download failed' }
          python -m py_compile experiments/cassandre_strict30_replay_pilot_20261026.py
      - name: Download and SHA-256 verify original Cassandre 0.24
        shell: pwsh
        run: |
          curl.exe -fL --retry 4 --connect-timeout 30 --max-time 300 'https://downloads.sourceforge.net/project/cassandre/cassandre/0.24/cassandre-0.24.WIN32.zip' -o cassandre.zip
          if ($LASTEXITCODE -ne 0) { throw 'Original Cassandre download failed' }
          Expand-Archive cassandre.zip cassandre -Force
          $exe=Get-ChildItem cassandre -Filter cassandre.exe -Recurse -File | Select-Object -First 1
          if (-not $exe) { throw 'Original Cassandre binary missing' }
          $hash=(Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '17d69f321244ab1f6530341b9207fe32fd415e80e017e6c33a827c84755839b7') { throw 'Cassandre SHA mismatch' }
          Add-Content -Path $env:GITHUB_ENV -Value "CASSANDRE_EXE=$($exe.FullName)"
      - name: Unscored distinct-manifest strict-time replay pilot
        shell: pwsh
        run: |
          python -u experiments/cassandre_strict30_replay_pilot_20261026.py --exe "$env:CASSANDRE_EXE" --dataset dataset/puzzles_2300.jsonl --manifest audit/cassandre-strict30-replay-manifest.jsonl --out strict_pilot --skip-puzzles ${{ inputs.skip_puzzles }} --max-puzzles ${{ inputs.max_puzzles }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content strict_pilot/summary.json
      - name: Preserve isolated unscored pilot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cassandre-strict30-unscored-pilot-${{ inputs.skip_puzzles }}
          path: strict_pilot/
          retention-days: 30
          if-no-files-found: warn
