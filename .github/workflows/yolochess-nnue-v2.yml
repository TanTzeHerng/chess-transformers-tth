name: Build YoloChess Version A

on:
  push:
    branches:
      - chatgpt/yolochess-nnue-v2-20261002
    paths:
      - yolochess-nnue-v2/**
      - .github/workflows/yolochess-nnue-v2.yml

permissions:
  contents: read

jobs:
  build-core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 zip

      - name: Fetch pinned Stockfish
        run: |
          git clone https://github.com/official-stockfish/Stockfish.git Stockfish
          cd Stockfish
          git checkout 49ea5ded38315cff8e67f4a677a9e7811612fbf6
          cd ..
          cp yolochess-nnue-v2/main.cpp Stockfish/src/main.cpp
          sed -i 's/-fno-exceptions/-fexceptions/g' Stockfish/src/Makefile

      - name: Build custom Windows NNUE core
        run: |
          make -C Stockfish/src -j2 build ARCH=x86-64-avx2 COMP=mingw CXX=x86_64-w64-mingw32-g++-posix STRIP=x86_64-w64-mingw32-strip EXTRACXXFLAGS="-fexceptions" EXTRALDFLAGS="-lwinhttp"
          cp Stockfish/src/stockfish.exe YoloChess-NNUE-Core.exe
          x86_64-w64-mingw32-strip YoloChess-NNUE-Core.exe
          ls -lh YoloChess-NNUE-Core.exe
          grep -n "EvalFileDefaultName" Stockfish/src/evaluate.h

      - name: Prepare GPL corresponding source
        run: |
          rm -rf Stockfish/.git
          find Stockfish -name '*.o' -delete
          rm -f Stockfish/src/stockfish Stockfish/src/stockfish.exe
          find Stockfish -name '*.nnue' -delete
          cp yolochess-nnue-v2/main.cpp Stockfish/YOLOCHESS_CUSTOM_MAIN.cpp
          zip -qr Stockfish-49ea5ded-YOLOChess-NNUE-source.zip Stockfish
          cp Stockfish/Copying.txt Stockfish-GPLv3.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: yolochess-nnue-core
          path: |
            YoloChess-NNUE-Core.exe
            Stockfish-49ea5ded-YOLOChess-NNUE-source.zip
            Stockfish-GPLv3.txt
          retention-days: 7

  build-windows:
    needs: build-core
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch exact Windows-safe engine sources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force yolochess-nnue-v2 | Out-Null
          $base = "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/yolochess-nnue-v2"
          foreach ($name in @("wrapper.py","main.cpp","smoke_test.py")) {
            curl.exe -L --fail --retry 3 "$base/$name" -o "yolochess-nnue-v2/$name"
          }
          python -m py_compile yolochess-nnue-v2/wrapper.py yolochess-nnue-v2/smoke_test.py

      - uses: actions/download-artifact@v4
        with:
          name: yolochess-nnue-core
          path: core

      - name: Verify native core
        shell: pwsh
        run: |
          @'
          import subprocess, time
          p=subprocess.Popen(["core/YoloChess-NNUE-Core.exe"],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,bufsize=1)
          def send(s): p.stdin.write(s+"\n"); p.stdin.flush()
          def until(prefix, timeout=15):
              end=time.time()+timeout
              while time.time()<end:
                  line=p.stdout.readline()
                  if not line:
                      if p.poll() is not None: raise RuntimeError("core exited")
                      continue
                  line=line.strip(); print(line)
                  if line.startswith(prefix): return line
              raise TimeoutError(prefix)
          send("uci"); until("uciok")
          send("isready"); until("readyok")
          send("position startpos")
          send("go depth 1")
          until("bestmove ")
          send("position startpos moves e2e4 e7e5")
          send("go nodes 2000")
          until("bestmove ")
          send("quit")
          p.wait(timeout=5)
          print("NATIVE CORE PASS")
          '@ | Set-Content verify_core.py
          python verify_core.py

      - name: Install wrapper build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install python-chess pyinstaller

      - name: Build single-file Windows UCI engine
        shell: pwsh
        run: |
          pyinstaller --onefile --clean --name YoloChess-Version-A --add-binary "core\YoloChess-NNUE-Core.exe;." yolochess-nnue-v2\wrapper.py
          Copy-Item dist\YoloChess-Version-A.exe .\YoloChess-Version-A.exe
          Get-Item YoloChess-Version-A.exe | Format-List Name,Length

      - name: UCI smoke tests
        shell: pwsh
        run: |
          python yolochess-nnue-v2\smoke_test.py .\YoloChess-Version-A.exe | Tee-Object -FilePath smoke_test.txt

      - name: Package GPL-compliant deliverable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deliverable | Out-Null
          Copy-Item YoloChess-Version-A.exe deliverable\
          Copy-Item yolochess-nnue-v2\wrapper.py deliverable\YoloChess-Version-A-wrapper-source.py
          Copy-Item yolochess-nnue-v2\main.cpp deliverable\YoloChess-Version-A-Core-main.cpp
          Copy-Item core\Stockfish-49ea5ded-YOLOChess-NNUE-source.zip deliverable\
          Copy-Item core\Stockfish-GPLv3.txt deliverable\
          Copy-Item smoke_test.txt deliverable\
          @"
          YoloChess Version A
          =====================

          Policy:
            live jrahn/yolochess transformer Space, deterministic top_k=1 at root.

          Evaluator:
            Stockfish master commit 49ea5ded38315cff8e67f4a677a9e7811612fbf6
            default SFNNv16-compatible NNUE: nn-252f33942263.nnue
            Static evaluation: raw Network::evaluate() output only.
            No Eval::evaluate() scaling, material alignment, total-material
            scaling, optimism term, or rule-50 damping is applied to leaf evals.

          Search:
            custom iterative deepening / aspiration / PVS
            transposition table
            quiescence search
            SEE-aware tactical ordering
            killer + history ordering
            basic late-move reductions
            repetition and 50-move handling

          Stockfish search is linked by the upstream build but is never invoked by
          the YOLOChess-NNUE core. Stockfish board/NNUE infrastructure is used under
          GPLv3; corresponding patched source is included.

          Supported UCI limits:
            go depth N
            go nodes N
            go movetime MS
            go wtime ... btime ... winc ... binc ... [movestogo N]
            go infinite / stop
            go searchmoves ...

          Internet access is required only for the YOLOChess root policy because
          jrahn/chessv6 remains private. If that request times out, NNUE search still runs.
          "@ | Set-Content deliverable\README.txt

          Get-FileHash YoloChess-Version-A.exe -Algorithm SHA256 | Format-List | Out-String | Set-Content deliverable\exe_sha256.txt
          Compress-Archive -Force deliverable\* YoloChess-Version-A-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: YoloChess-Version-A-Windows-x64
          path: |
            YoloChess-Version-A-Windows-x64.zip
            deliverable/**
          retention-days: 7
