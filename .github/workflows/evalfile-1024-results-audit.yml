name: SF17.1 NNUE 1024-thread Results Audit
on:
  push:
    paths:
      - .github/workflows/evalfile-1024-results-audit.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: experiments
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install statistical dependency
        run: python -m pip install --quiet scipy==1.14.1
      - name: Download and validate saved per-shard chess results
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u experiments/evalfile_1024_aggregate_20261022.py
      - name: Preserve audited scoreboard and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sf171-1024-aggregated-audit
          path: nnue_audit/
          retention-days: 90
