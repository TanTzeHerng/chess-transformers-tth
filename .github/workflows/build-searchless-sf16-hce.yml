name: Build Searchless SF16 HCE Hybrid

on:
  push:
    branches:
      - hybrid-searchless-sf16-hce-20261007
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decode hybrid source
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, pathlib
          src = pathlib.Path("hybrid_searchless_sf16/source.py.gz.b64")
          out = pathlib.Path("hybrid_searchless_sf16/hybrid_searchless_sf16.py")
          out.write_bytes(gzip.decompress(base64.b64decode(src.read_text().strip())))
          print("decoded", out, out.stat().st_size, "bytes")
          PY
          python -m py_compile hybrid_searchless_sf16/hybrid_searchless_sf16.py

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-mingw-w64-x86-64
          python -m pip install --upgrade pip
          python -m pip install pyinstaller python-chess numpy onnxruntime

      - name: Fetch and patch Stockfish 16 classical evaluator helper
        shell: bash
        run: |
          git clone --depth 1 --branch sf_16 https://github.com/official-stockfish/Stockfish.git sf16
          python - <<'PY'
          from pathlib import Path
          p = Path("sf16/src/uci.cpp")
          s = p.read_text()
          old = '      else if (token == "eval")     trace_eval(pos);'
          new = '''      else if (token == "evalraw")
          {
              // Hybrid helper command. It deliberately bypasses NNUE.
              // Eval::evaluate() in Stockfish 16 selects Evaluation<NO_TRACE>
              // whenever Eval::useNNUE is false.
              Eval::useNNUE = false;
              if (pos.checkers())
                  sync_cout << "evalraw check" << sync_endl;
              else
              {
                  Value v = Eval::evaluate(pos);
                  sync_cout << "evalraw " << int(v) << sync_endl;
              }
          }
          else if (token == "eval")     trace_eval(pos);'''
          if old not in s:
              raise SystemExit("patch anchor not found")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Prove native SF16 HCE helper
        shell: bash
        run: |
          cd sf16/src
          make -j2 ARCH=x86-64 COMP=gcc EXTRACXXFLAGS=-DNNUE_EMBEDDING_OFF all
          OUT="$(printf 'uci\nsetoption name Use NNUE value false\nisready\nposition startpos\nevalraw\nposition fen 7k/5Q2/7K/8/8/8/8/8 b - - 0 1\nevalraw\nquit\n' | ./stockfish)"
          echo "$OUT"
          echo "$OUT" | grep -q 'option name Use NNUE'
          echo "$OUT" | grep -Eq 'evalraw -?[0-9]+'
          echo "$OUT" | grep -q 'evalraw check'

      - name: Cross-compile Windows SF16 HCE helper
        shell: bash
        run: |
          cd sf16/src
          make objclean
          make -j2 ARCH=x86-64 COMP=mingw EXTRACXXFLAGS=-DNNUE_EMBEDDING_OFF all
          test -f stockfish.exe

      - name: Build hybrid Windows UCI executable
        shell: bash
        run: |
          cd hybrid_searchless_sf16
          pyinstaller --noconfirm --clean --onefile --name Searchless-SF16-HCE hybrid_searchless_sf16.py
          test -f dist/Searchless-SF16-HCE.exe

      - name: Assemble package
        shell: bash
        run: |
          mkdir -p package
          cp hybrid_searchless_sf16/dist/Searchless-SF16-HCE.exe package/
          cp sf16/src/stockfish.exe package/stockfish16_hce.exe
          cp hybrid_searchless_sf16/hybrid_searchless_sf16.py package/
          cp sf16/Copying.txt package/STOCKFISH-GPL-3.txt
          cat > package/README.txt <<'EOF'
          Searchless + Stockfish 16 Classical Evaluation Hybrid

          Policy:
            Google DeepMind Searchless Chess action-value transformer.
            UCI Model combo: 9M / 136M / 270M.
            Searchless scores are used only for legal-move policy ordering/selectivity.

          Value:
            Stockfish 16 classical hand-crafted evaluation from official tag sf_16.
            NNUE is forcibly disabled inside the helper's evalraw command.
            The helper is stockfish16_hce.exe.

          Search:
            Iterative deepening negamax/PVS/alpha-beta.
            Searchless supplies move policy/order; SF16 HCE supplies leaf values.
            Terminal chess results are exact.
            Checks are extended until a statically evaluable position.

          UCI:
            Supports go depth, go nodes, go movetime and normal clock fields.
            Model is selectable as 9M, 136M, or 270M.

          Licenses:
            Stockfish helper: GPLv3, source https://github.com/official-stockfish/Stockfish tag sf_16.
            DeepMind Searchless Chess code: Apache-2.0.
            DeepMind model weights: CC BY 4.0.
            Converted ONNX weights are downloaded at runtime and are not embedded here.
          EOF
          (cd package && sha256sum * > SHA256SUMS.txt)
          zip -9 -r Searchless-SF16-HCE-Windows.zip package

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Searchless-SF16-HCE-Windows
          path: Searchless-SF16-HCE-Windows.zip
          retention-days: 30
