name: Build Searchless SF16 HCE Hybrid

on:
  push:
    branches:
      - hybrid-searchless-sf16-hce-20261007
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  sf16-helper:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-mingw-w64-x86-64

      - name: Decode hybrid source
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib
          src = pathlib.Path("hybrid_searchless_sf16/source.py.gz.b64")
          out = pathlib.Path("hybrid_searchless_sf16/hybrid_searchless_sf16.py")
          out.write_bytes(gzip.decompress(base64.b64decode(src.read_text().strip())))
          print("decoded", out, out.stat().st_size, "bytes")
          PY
          python3 -m py_compile hybrid_searchless_sf16/hybrid_searchless_sf16.py

      - name: Fetch and patch Stockfish 16
        shell: bash
        run: |
          git clone --depth 1 --branch sf_16 https://github.com/official-stockfish/Stockfish.git sf16
          python3 - <<'PY'
          from pathlib import Path
          p = Path("sf16/src/uci.cpp")
          s = p.read_text()
          old = '      else if (token == "eval")     trace_eval(pos);'
          new = '''      else if (token == "evalraw")
          {
              Eval::useNNUE = false;
              if (pos.checkers())
                  sync_cout << "evalraw check" << sync_endl;
              else
              {
                  Value v = Eval::evaluate(pos);
                  sync_cout << "evalraw " << int(v) << sync_endl;
              }
          }
          else if (token == "eval")     trace_eval(pos);'''
          if old not in s:
              raise SystemExit("patch anchor not found")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Prove native SF16 classical evaluator
        shell: bash
        run: |
          cd sf16/src
          make -j2 ARCH=x86-64 COMP=gcc EXTRACXXFLAGS=-DNNUE_EMBEDDING_OFF all
          OUT="$(printf 'uci\nsetoption name Use NNUE value false\nisready\nposition startpos\nevalraw\nposition fen 7k/6Q1/7K/8/8/8/8/8 b - - 0 1\nevalraw\nquit\n' | ./stockfish)"
          echo "$OUT"
          echo "$OUT" | grep -q 'option name Use NNUE'
          echo "$OUT" | grep -Eq 'evalraw -?[0-9]+'
          echo "$OUT" | grep -q 'evalraw check'

      - name: Cross-compile Windows SF16 HCE helper
        shell: bash
        run: |
          cd sf16/src
          make objclean
          make -j2 ARCH=x86-64 COMP=mingw EXTRACXXFLAGS=-DNNUE_EMBEDDING_OFF all
          test -f stockfish.exe
          mkdir -p ../../hybrid-build-input
          cp stockfish.exe ../../hybrid-build-input/stockfish16-classical-helper.exe
          cp ../Copying.txt ../../hybrid-build-input/STOCKFISH-GPL-3.txt
          cp ../../hybrid_searchless_sf16/hybrid_searchless_sf16.py ../../hybrid-build-input/

      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-build-input
          path: hybrid-build-input
          retention-days: 30

  windows-package:
    needs: sf16-helper
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python runtime and packager
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller python-chess numpy onnxruntime

      - uses: actions/download-artifact@v4
        with:
          name: hybrid-build-input
          path: work

      - name: Verify build input
        shell: pwsh
        run: |
          Get-ChildItem work
          python -m py_compile work/hybrid_searchless_sf16.py
          if (!(Test-Path "work/stockfish16-classical-helper.exe")) { throw "SF16 HCE helper missing" }

      - name: Build Windows hybrid UCI executable
        shell: pwsh
        run: |
          Set-Location work
          pyinstaller --noconfirm --clean --onefile --name Searchless-SF16-HCE hybrid_searchless_sf16.py
          if (!(Test-Path "dist/Searchless-SF16-HCE.exe")) { throw "Hybrid exe missing" }

      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item work/dist/Searchless-SF16-HCE.exe package/
          Copy-Item work/stockfish16-classical-helper.exe package/
          Copy-Item work/STOCKFISH-GPL-3.txt package/
          Copy-Item work/hybrid_searchless_sf16.py package/
          @'
          Searchless + Stockfish 16 Classical Evaluation Hybrid

          POLICY HEAD
          Google DeepMind Searchless Chess action-value transformer.
          Model option: 9M / 136M / 270M.
          Searchless output is used only to rank/select legal moves.

          VALUE HEAD
          Stockfish 16 classical hand-crafted evaluation from official tag sf_16.
          The helper is stockfish16-classical-helper.exe.
          Its custom evalraw command forcibly sets Eval::useNNUE=false before every
          static evaluation. No NNUE score is used by the hybrid search.

          SEARCH
          Iterative-deepening negamax/PVS/alpha-beta.
          Terminal results are exact. Positions in check are extended until the
          SF16 classical evaluator can legally score a quiet/static position.

          UCI
          Supports go depth, go nodes, go movetime and normal clock fields.
          The Searchless model is selectable with the Model combo option.

          MODEL FILES
          Searchless ONNX weights are downloaded at runtime and are not embedded
          in this package.

          LICENSES
          Stockfish 16 helper: GPLv3. Source:
          https://github.com/official-stockfish/Stockfish/tree/sf_16
          DeepMind Searchless Chess code: Apache-2.0.
          DeepMind Searchless model weights: CC BY 4.0.
          '@ | Set-Content -Encoding UTF8 package/README.txt

          Get-ChildItem package -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content package/SHA256SUMS.txt

      - name: Windows UCI smoke test
        shell: pwsh
        run: |
          $nl = [Environment]::NewLine
          $inputText = "uci" + $nl + "isready" + $nl + "quit" + $nl
          $out = $inputText | & .\package\Searchless-SF16-HCE.exe
          $out | Write-Host
          $joined = $out -join $nl
          if ($joined -notmatch "uciok") { throw "uciok missing" }
          if ($joined -notmatch "readyok") { throw "readyok missing" }
          if ($joined -notmatch "option name Model type combo") { throw "Model combo missing" }

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path package\* -DestinationPath Searchless-SF16-HCE-Windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Searchless-SF16-HCE-Windows
          path: Searchless-SF16-HCE-Windows.zip
          retention-days: 30
