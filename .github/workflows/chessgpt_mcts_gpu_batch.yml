name: ChessGPT GPU batched-policy MCTS correctness and CPU fallback benchmarks
on:
  push:
    branches:
      - experiment/chessgpt-mcts-gpu-batch-20261014
    paths:
      - .github/workflows/chessgpt_mcts_gpu_batch.yml
      - experiments/chessgpt_mcts_elite2/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: experiments/chessgpt_mcts_elite2
    env:
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "4"
      OMP_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
      CHESSGPT_INT8: "1"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download only experimental Python scripts
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p experiments/chessgpt_mcts_elite2
          root="https://raw.githubusercontent.com/TanTzeHerng/chess-transformers-tth/refs/heads/experiment/chessgpt-mcts-gpu-batch-20261014/experiments/chessgpt_mcts_elite2"
          for file in chessgpt_mcts_uci.py accelerated_mcts.py match.py; do
            curl -fL --retry 5 -o "experiments/chessgpt_mcts_elite2/$file" "$root/$file"
          done
          curl -fL --retry 5 -o experiments/chessgpt_mcts_elite2/cloud_match.py "https://raw.githubusercontent.com/TanTzeHerng/chess-transformers-tth/refs/heads/experiment/chessgpt-maia1900-promptfix-20261013/experiments/chessgpt_maia1900/cloud_match.py"
      - name: Install CPU-only torch
        run: |
          python -m pip install --no-cache-dir python-chess
          python -m pip install --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Download ChessGPT original checkpoint and model code
        run: |
          curl -fL --retry 5 -o model.py "https://raw.githubusercontent.com/adamkarvonen/train_ChessGPT/master/model.py"
          curl -fL --retry 6 -o stockfish_16layers_ckpt_with_optimizer.pt "https://huggingface.co/adamkarvonen/chess_llms/resolve/main/stockfish_16layers_ckpt_with_optimizer.pt"
          test "$(wc -c < stockfish_16layers_ckpt_with_optimizer.pt)" -eq 610803879
      - name: Install original Stockfish 16 Linux classical evaluator
        run: |
          mkdir -p stockfish16 sf16_download
          curl -fL --retry 5 -o sf16.tar "https://github.com/official-stockfish/Stockfish/releases/download/sf_16/stockfish-ubuntu-x86-64-avx2.tar"
          tar -xf sf16.tar -C sf16_download
          find sf16_download -type f | head -n 20
          sf=$(find sf16_download -type f -name '*stockfish*' ! -name '*.nnue' ! -name '*.md' ! -name '*.txt' | head -n 1)
          test -n "$sf"
          cp "$sf" stockfish16/stockfish-windows-x64-avx2.exe
          chmod +x stockfish16/stockfish-windows-x64-avx2.exe
          echo uci | stockfish16/stockfish-windows-x64-avx2.exe | head -n 12
      - name: Validate GPU batching mathematics on CPU with original neural weights
        run: |
          python -m py_compile cloud_match.py chessgpt_mcts_uci.py accelerated_mcts.py match.py
          cat > gpu_test.py <<'PY'
          import os,time,threading,torch,chess
          os.environ['CHESSGPT_TEST_GPU_BATCH_CPU']='1'
          from cloud_match import load_gpt
          from accelerated_mcts import BatchPolicy,pick_accelerator
          from chessgpt_mcts_uci import Policy
          model=load_gpt()
          torch.set_num_threads(4)
          a=chess.Board();b=chess.Board()
          for san in ['e4','e5','Nf3','Nc6']:b.push_san(san)
          positions=[a,b]
          policy=BatchPolicy(model,torch.device('cpu'),move_batch=48)
          accelerated=policy.candidates_batch(positions,8,time.monotonic()+90,threading.Event())
          reference=Policy(model)
          for board,computed in zip(positions,accelerated):
              baseline=reference.candidates(board,8,time.monotonic()+90,threading.Event())
              want={m.uci():p for m,p in baseline}
              got={m.uci():p for m,p in computed}
              assert set(want)==set(got),(list(want),list(got))
              delta=max(abs(want[m]-got[m]) for m in want)
              print('BATCH_POLICY_EQUIVALENCE',board.ply(),'legal',board.legal_moves.count(),
                    'topK',len(computed),'maxPriorError',delta,flush=True)
              assert delta<0.002
          assert policy.batches==1 and policy.leaves_scored==2
          print('BATCH_POLICY_EQUIVALENCE_PASS',flush=True)
          PY
          python -u gpu_test.py
      - name: Benchmark virtual-loss batched MCTS 2.5 and 5-second UCI searches
        run: |
          cat > bench.py <<'PY'
          import os,sys,time,chess,chess.engine
          from pathlib import Path
          exe=[sys.executable,'-u',str(Path('chessgpt_mcts_uci.py').resolve())]
          positions=[('startpos',chess.Board())]
          mid=chess.Board()
          for san in ['e4','e5','Nf3','Nc6','Bb5','a6','Ba4','Nf6','O-O','Be7',
                      'Re1','b5','Bb3','d6','c3','O-O','h3','Nb8','d4','Nbd7']:
              mid.push_san(san)
          positions.append(('20ply',mid))
          with chess.engine.SimpleEngine.popen_uci(exe,timeout=180) as eng:
              eng.configure({'TorchThreads':4,'SANBatchSize':64,'LeafBatch':8})
              for title,position in positions:
                  for length in (2.5,5.0):
                      start=time.monotonic()
                      r=eng.play(position,chess.engine.Limit(time=length),
                                  info=chess.engine.INFO_ALL,game=object())
                      wall=time.monotonic()-start
                      print('BATCH_MCTS_CPU',title,length,'simulations',r.info.get('nodes'),
                            'time',round(wall,3),'depth',r.info.get('seldepth'),
                            'move',r.move,flush=True)
                      assert r.move in position.legal_moves
                      assert r.info.get('nodes',0)>1
                      assert wall<length+3.0
          print('BATCH_MCTS_CPU_BENCH_COMPLETE',flush=True)
          PY
          python -u bench.py
