name: Searchless270M vs TobyCoad fast pair

on:
  push:
    branches:
      - tmp-searchless270m-toby-20261007-v2
    paths:
      - ".github/workflows/searchless270m_fast2.yml"

jobs:
  game:
    strategy:
      fail-fast: false
      matrix:
        game: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-searchless270m-toby-20261007-v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime
        run: python -m pip install -q "chess==1.11.2" numpy numba onnxruntime

      - name: Fetch TobyCoad
        run: |
          rm -rf searchless_toby/toby
          git clone --depth 1 https://github.com/TobyCoad/aichessathon-starter.git searchless_toby/toby
          test -f searchless_toby/toby/weights/net.npz

      - name: Fetch Searchless 270M
        run: |
          rm -f searchless_toby/model.onnx
          curl -L --fail --retry 3 -o searchless_toby/model.onnx \
            https://huggingface.co/cstr/searchless-chess-onnx/resolve/main/270M/model_fp16.onnx

      - name: Run game
        run: |
          rm -rf searchless_toby/results
          mkdir -p searchless_toby/results
          if [ "${{ matrix.game }}" = "1" ]; then COLOR=white; else COLOR=black; fi
          python searchless_toby/run_game.py --game ${{ matrix.game }} --toby-color $COLOR

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: searchless270m-toby-game-${{ matrix.game }}
          path: searchless_toby/results/
          if-no-files-found: warn
