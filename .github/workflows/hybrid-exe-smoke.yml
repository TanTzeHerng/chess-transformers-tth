name: hybrid-exe-fast-smoke
on:
  pull_request:
    branches: [ main ]
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct package
        shell: pwsh
        run: |
          $b64 = (Get-Content pkgpart1.txt -Raw) + (Get-Content pkgpart2.txt -Raw) + (Get-Content pkgpart3.txt -Raw) + (Get-Content pkgpart4.txt -Raw)
          [IO.File]::WriteAllBytes("pkg.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Path pkg.zip -DestinationPath pkg
      - name: Install build deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pkg/requirements.txt
      - name: Build fast onedir EXE
        shell: pwsh
        run: |
          cd pkg
          python -m PyInstaller --noconfirm --clean --onedir --console --name Searchless-SF16-Hybrid-UCI --collect-all onnxruntime --hidden-import=onnxruntime.capi._pybind_state Searchless-SF16-Hybrid-UCI.py
      - name: Measure UCI startup
        shell: pwsh
        run: |
          $exe = Resolve-Path "pkg/dist/Searchless-SF16-Hybrid-UCI/Searchless-SF16-Hybrid-UCI.exe"
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $exe.Path
          $psi.WorkingDirectory = Split-Path $exe.Path
          $psi.UseShellExecute = $false
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.CreateNoWindow = $true
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = New-Object Diagnostics.Process
          $p.StartInfo = $psi
          $p.Start() | Out-Null
          $p.StandardInput.WriteLine("uci")
          $lines = New-Object Collections.Generic.List[string]
          $uciMs = $null
          while ($sw.ElapsedMilliseconds -lt 10000) {
            $line = $p.StandardOutput.ReadLine()
            if ($null -eq $line) { break }
            $lines.Add($line)
            if ($line -eq "uciok") { $uciMs = $sw.ElapsedMilliseconds; break }
          }
          Write-Host "UCI_MS=$uciMs"
          $lines | ForEach-Object { Write-Host $_ }
          if ($null -eq $uciMs) { throw "No uciok" }
          if ($uciMs -gt 2000) { throw "Startup too slow for conservative GUI compatibility: $uciMs ms" }
          $p.StandardInput.WriteLine("isready")
          $ready = $p.StandardOutput.ReadLine()
          while ($ready -ne "readyok") { if ($null -eq $ready) { throw "EOF before readyok" }; $ready = $p.StandardOutput.ReadLine() }
          Write-Host "READY_MS=$($sw.ElapsedMilliseconds)"
          $p.StandardInput.WriteLine("quit")
          $p.StandardInput.Close()
          if (-not $p.WaitForExit(10000)) { $p.Kill(); throw "hang on quit" }
          if ($p.ExitCode -ne 0) { throw "exit $($p.ExitCode)" }
      - name: Install runtime data for play test
        shell: pwsh
        run: |
          $dir = "pkg/dist/Searchless-SF16-Hybrid-UCI"
          New-Item -ItemType Directory -Force "$dir/models/9M" | Out-Null
          New-Item -ItemType Directory -Force "$dir/stockfish16" | Out-Null
          Invoke-WebRequest -Uri "https://huggingface.co/cstr/searchless-chess-onnx/resolve/main/9M/model.onnx" -OutFile "$dir/models/9M/model.onnx"
          Invoke-WebRequest -Uri "https://github.com/official-stockfish/Stockfish/releases/download/sf_16/stockfish-windows-x86-64.zip" -OutFile "$dir/sf16.zip"
          Expand-Archive "$dir/sf16.zip" "$dir/stockfish16"
          Remove-Item "$dir/sf16.zip"

      - name: Real move smoke
        shell: pwsh
        run: |
          $dir = Resolve-Path "pkg/dist/Searchless-SF16-Hybrid-UCI"
          $exe = Join-Path $dir.Path "Searchless-SF16-Hybrid-UCI.exe"
          $psi = New-Object Diagnostics.ProcessStartInfo
          $psi.FileName = $exe
          $psi.WorkingDirectory = $dir.Path
          $psi.UseShellExecute = $false
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.CreateNoWindow = $true
          $p = New-Object Diagnostics.Process
          $p.StartInfo = $psi
          $p.Start() | Out-Null
          $p.StandardInput.WriteLine("uci")
          while (($line=$p.StandardOutput.ReadLine()) -ne "uciok") { if ($null -eq $line) { throw "EOF before uciok" } }
          $p.StandardInput.WriteLine("setoption name Model value 9M")
          $p.StandardInput.WriteLine("setoption name Backend value CPU")
          $p.StandardInput.WriteLine("setoption name Threads value 2")
          $p.StandardInput.WriteLine("isready")
          while (($line=$p.StandardOutput.ReadLine()) -ne "readyok") { if ($null -eq $line) { throw "EOF before readyok" } }
          $p.StandardInput.WriteLine("ucinewgame")
          $p.StandardInput.WriteLine("position startpos")
          $p.StandardInput.WriteLine("go depth 1")
          $sw=[Diagnostics.Stopwatch]::StartNew()
          $best=$null
          while ($sw.ElapsedMilliseconds -lt 60000) {
            $line=$p.StandardOutput.ReadLine()
            if ($null -eq $line) { throw "EOF during go" }
            Write-Host $line
            if ($line -match "^bestmove\s+([a-h][1-8][a-h][1-8][qrbn]?)$") { $best=$Matches[1]; break }
          }
          if (-not $best) { $p.Kill(); throw "No bestmove" }
          Write-Host "PLAY_TEST_BESTMOVE=$best"
          $p.StandardInput.WriteLine("quit")
          $p.StandardInput.Close()
          if (-not $p.WaitForExit(10000)) { $p.Kill(); throw "hang on quit" }
          if ($p.ExitCode -ne 0) { throw "exit $($p.ExitCode)" }

      - name: Upload fast engine folder
        uses: actions/upload-artifact@v4
        with:
          name: Searchless-SF16-Hybrid-UCI-fast
          path: pkg/dist/Searchless-SF16-Hybrid-UCI/
