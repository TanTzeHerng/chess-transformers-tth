name: hybrid-v25-lowmem
on:
  pull_request:
    branches: [ main ]

jobs:
  windows-lowmem:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct original source package without checkout
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          1..4 | ForEach-Object {
            gh api -H "Accept: application/vnd.github.raw+json" "/repos/TanTzeHerng/chess-transformers-tth/contents/pkgpart$_.txt?ref=tmp-hybrid-v22-embedded-hce-build-20261007" > "pkgpart$_.txt"
          }
          $b64 = (Get-Content pkgpart1.txt -Raw) + (Get-Content pkgpart2.txt -Raw) + (Get-Content pkgpart3.txt -Raw) + (Get-Content pkgpart4.txt -Raw)
          [IO.File]::WriteAllBytes("pkg.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Path pkg.zip -DestinationPath pkg

      - name: Patch v2.4 CPU-safe engine
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p=Path("pkg/Searchless-SF16-Hybrid-UCI.py")
          s=p.read_text(encoding="utf-8")
          s=s.replace('ENGINE_NAME = "Searchless + Stockfish16 HCE Hybrid 2.0"', 'ENGINE_NAME = "Searchless + Stockfish16 HCE Hybrid 2.5 Low-Memory"')

          old='''RUN_DIR = pathlib.Path(sys.executable).resolve().parent if getattr(sys, "frozen", False) else pathlib.Path(__file__).resolve().parent
          MODEL_DIR = RUN_DIR / "models"
          SF_DIR = RUN_DIR / "stockfish16"
          MODEL_DIR.mkdir(parents=True, exist_ok=True)
          SF_DIR.mkdir(parents=True, exist_ok=True)
          '''
          new='''RUN_DIR = pathlib.Path(sys.executable).resolve().parent if getattr(sys, "frozen", False) else pathlib.Path(__file__).resolve().parent
          BUNDLE_DIR = pathlib.Path(getattr(sys, "_MEIPASS", RUN_DIR)).resolve()
          MODEL_DIR = RUN_DIR / "models"
          SF_DIR = RUN_DIR / "stockfish16"
          MODEL_DIR.mkdir(parents=True, exist_ok=True)
          SF_DIR.mkdir(parents=True, exist_ok=True)

          def hce_search_dirs() -> list[pathlib.Path]:
              dirs = [RUN_DIR / "stockfish16", BUNDLE_DIR / "stockfish16", RUN_DIR / "_internal" / "stockfish16"]
              out = []
              seen = set()
              for d in dirs:
                  try:
                      key = str(d.resolve()).lower()
                  except Exception:
                      key = str(d).lower()
                  if key not in seen:
                      seen.add(key)
                      out.append(d)
              return out
          '''
          if old not in s: raise SystemExit("RUN_DIR block not found")
          s=s.replace(old,new)

          old2='''        candidates = []
                  if os.name == "nt":
                      candidates += list(SF_DIR.rglob("stockfish*.exe"))
                  else:
                      candidates += [p for p in SF_DIR.rglob("stockfish*") if p.is_file() and os.access(p, os.X_OK)]
                  if candidates:
                      candidates.sort(key=lambda p: ("x86-64" not in p.name.lower(), len(str(p))))
                      return candidates[0]
          '''
          new2='''        candidates = []
                  for root in hce_search_dirs():
                      if not root.exists():
                          continue
                      if os.name == "nt":
                          candidates += [p for p in root.rglob("stockfish*.exe") if p.is_file()]
                      else:
                          candidates += [p for p in root.rglob("stockfish*") if p.is_file() and os.access(p, os.X_OK)]
                  if candidates:
                      candidates.sort(key=lambda p: ("x86-64" not in p.name.lower(), len(str(p))))
                      return candidates[0]
          '''
          if old2 not in s: raise SystemExit("HCE block not found")
          s=s.replace(old2,new2)

          s=s.replace('self.backend = "Auto"', 'self.backend = "CPU"')
          old3='''        if self.backend == "CPU":
                      return ["CPUExecutionProvider"]
                  if self.backend == "DirectML":
                      if "DmlExecutionProvider" in available:
                          return ["DmlExecutionProvider", "CPUExecutionProvider"]
                      print("info string DirectML unavailable; falling back to CPU", flush=True)
                      return ["CPUExecutionProvider"]
                  if "DmlExecutionProvider" in available:
                      return ["DmlExecutionProvider", "CPUExecutionProvider"]
                  return ["CPUExecutionProvider"]
          '''
          new3='''        if self.backend == "DirectML":
                      if "DmlExecutionProvider" in available:
                          return ["DmlExecutionProvider", "CPUExecutionProvider"]
                      print("info string DirectML unavailable; falling back to CPU", flush=True)
                      return ["CPUExecutionProvider"]
                  # CPU is the stable default. Legacy Auto is intentionally CPU too.
                  return ["CPUExecutionProvider"]
          '''
          if old3 not in s: raise SystemExit("provider block not found")
          s=s.replace(old3,new3)
          s=s.replace('print("option name Backend type combo default Auto var Auto var CPU var DirectML", flush=True)',
                      'print("option name Backend type combo default CPU var CPU var DirectML var Auto", flush=True)')

          marker='''MATE = 32000
          INF = 40000


          '''
          diag='''MATE = 32000
          INF = 40000

          DEBUG_LOG = RUN_DIR / "Searchless-Hybrid-debug.log"

          def debug_log(message: str) -> None:
              try:
                  with DEBUG_LOG.open("a", encoding="utf-8") as f:
                      f.write(time.strftime("%Y-%m-%d %H:%M:%S") + " " + message + "\\n")
                      f.flush()
              except Exception:
                  pass

          try:
              import faulthandler
              _fault_file = open(RUN_DIR / "Searchless-Hybrid-native-crash.log", "a", encoding="utf-8", buffering=1)
              faulthandler.enable(_fault_file, all_threads=True)
          except Exception:
              _fault_file = None


          '''
          if marker not in s: raise SystemExit("diagnostic marker not found")
          s=s.replace(marker,diag)

          s=s.replace('''        def worker():
                      try:
                          searcher = HybridSearcher(
          ''','''        def worker():
                      debug_log(f"SEARCH START model={model_name} backend={self.policy.backend} limits={limits}")
                      try:
                          searcher = HybridSearcher(
          ''')
          s=s.replace('''            except Exception as exc:
                          print(f"info string search error: {type(exc).__name__}: {exc}", flush=True)
          ''','''            except Exception as exc:
                          debug_log(f"SEARCH ERROR {type(exc).__name__}: {exc}")
                          print(f"info string search error: {type(exc).__name__}: {exc}", flush=True)
          ''')
          s=s.replace('''            finally:
                          with self.lock:
                              self.search_thread = None
          ''','''            finally:
                          debug_log("SEARCH END")
                          with self.lock:
                              self.search_thread = None
          ''')
          s=s.replace('''    def loop(self):
                  for raw in sys.stdin:
                      line = raw.strip()
          ''','''    def loop(self):
                  debug_log(f"START {ENGINE_NAME} pid={os.getpid()} backend_default={self.policy.backend}")
                  for raw in sys.stdin:
                      line = raw.strip()
          ''')
          s=s.replace('''            if not line:
                          continue
                      try:
          ''','''            if not line:
                          continue
                      debug_log("UCI <= " + line)
                      try:
          ''')
          p.write_text(s,encoding="utf-8")
          '@ | python -
          python -m py_compile pkg/Searchless-SF16-Hybrid-UCI.py

      - name: Patch v2.5 low-memory policy batching
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p=Path("pkg/Searchless-SF16-Hybrid-UCI.py")
          s=p.read_text(encoding="utf-8")
          s=s.replace('ENGINE_NAME = "Searchless + Stockfish16 HCE Hybrid 2.4 CPU-Safe"',
                      'ENGINE_NAME = "Searchless + Stockfish16 HCE Hybrid 2.5 Low-Memory"')

          s=s.replace('''        self.backend = "CPU"
                  self.lock = threading.RLock()
          ''','''        self.backend = "CPU"
                  self.batch_size = 4
                  self.lock = threading.RLock()
          ''')

          s=s.replace('''            opts.graph_optimization_level = ort.GraphOptimizationLevel.ORT_ENABLE_ALL
                  providers = self._providers()
                  if providers and providers[0] == "DmlExecutionProvider":
                      opts.enable_mem_pattern = False
                      opts.execution_mode = ort.ExecutionMode.ORT_SEQUENTIAL
          ''','''            opts.graph_optimization_level = ort.GraphOptimizationLevel.ORT_ENABLE_ALL
                  # Low-memory mode: do not retain large CPU allocator arenas or
                  # shape-specific activation patterns between policy calls.
                  opts.enable_mem_pattern = False
                  opts.enable_cpu_mem_arena = False
                  opts.execution_mode = ort.ExecutionMode.ORT_SEQUENTIAL
                  providers = self._providers()
          ''')

          old='''        seqs = np.zeros((len(moves), SEQ_LEN), dtype=np.int64)
                  seqs[:, :FEN_TOKEN_COUNT] = ft[None, :]
                  seqs[:, FEN_TOKEN_COUNT] = [MOVE_TO_ACTION[m.uci()] for m in moves]
                  with self.lock:
                      assert self.session is not None
                      out = self.session.run(None, {"tokens": seqs})[0]
                  probs = np.exp(out.astype(np.float64)) @ BUCKET_VALUES.astype(np.float64)
                  return [(m, float(p)) for m, p in zip(moves, probs)]
          '''
          new='''        seqs = np.zeros((len(moves), SEQ_LEN), dtype=np.int64)
                  seqs[:, :FEN_TOKEN_COUNT] = ft[None, :]
                  seqs[:, FEN_TOKEN_COUNT] = [MOVE_TO_ACTION[m.uci()] for m in moves]

                  # Every row is an independent Searchless sequence.  Splitting
                  # the legal-move batch therefore preserves the policy math while
                  # sharply reducing peak transformer activation memory.
                  chunks = []
                  bs = max(1, min(64, int(self.batch_size)))
                  with self.lock:
                      assert self.session is not None
                      for lo in range(0, len(moves), bs):
                          hi = min(len(moves), lo + bs)
                          out = self.session.run(None, {"tokens": seqs[lo:hi]})[0]
                          q = np.exp(out.astype(np.float64)) @ BUCKET_VALUES.astype(np.float64)
                          chunks.append(q)
                          del out
                  probs = np.concatenate(chunks, axis=0)
                  return [(m, float(p)) for m, p in zip(moves, probs)]
          '''
          if old not in s: raise SystemExit("score_actions block not found")
          s=s.replace(old,new)

          s=s.replace('''        elif lname == "threads":
          ''','''        elif lname == "policy batch":
                      try:
                          self.policy.batch_size = max(1, min(64, int(value)))
                      except ValueError:
                          pass
                  elif lname == "threads":
          ''')

          s=s.replace('''        print("option name Policy Width type spin default 8 min 1 max 256", flush=True)
          ''','''        print("option name Policy Width type spin default 8 min 1 max 256", flush=True)
                  print("option name Policy Batch type spin default 4 min 1 max 64", flush=True)
          ''')

          p.write_text(s,encoding="utf-8")
          '@ | python -
          python -m py_compile pkg/Searchless-SF16-Hybrid-UCI.py

      - name: Download Stockfish 16 and Searchless 270M
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/official-stockfish/Stockfish/releases/download/sf_16/stockfish-windows-x86-64.zip" -OutFile sf16.zip
          Expand-Archive sf16.zip embed-sf
          $sf = Get-ChildItem -Recurse embed-sf -Filter "stockfish-windows-x86-64.exe" | Select-Object -First 1
          if (-not $sf) { throw "Stockfish 16 missing" }
          Copy-Item $sf.FullName "pkg/stockfish16-embedded.exe"

          New-Item -ItemType Directory -Force "model270" | Out-Null
          Invoke-WebRequest -Uri "https://huggingface.co/cstr/searchless-chess-onnx/resolve/main/270M/model_fp16.onnx" -OutFile "model270/model_fp16.onnx"
          $m=Get-Item "model270/model_fp16.onnx"
          Write-Host "MODEL270_BYTES=$($m.Length)"
          if($m.Length -lt 400000000) { throw "270M model too small" }

      - name: Install CPU-only runtime and PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 chess==1.11.2 onnxruntime==1.24.4 pyinstaller==6.22.3 psutil

      - name: Build CPU-safe engine
        shell: pwsh
        run: |
          cd pkg
          python -m PyInstaller --noconfirm --clean --onedir --console --name Searchless-SF16-Hybrid-UCI --collect-all onnxruntime --hidden-import=onnxruntime.capi._pybind_state --add-binary "stockfish16-embedded.exe;stockfish16" Searchless-SF16-Hybrid-UCI.py
          cd ..
          New-Item -ItemType Directory -Force "pkg/dist/Searchless-SF16-Hybrid-UCI/models/270M" | Out-Null
          Copy-Item "model270/model_fp16.onnx" "pkg/dist/Searchless-SF16-Hybrid-UCI/models/270M/model_fp16.onnx"

      - name: Verify default UCI advertises CPU
        shell: pwsh
        run: |
          $dir=Resolve-Path "pkg/dist/Searchless-SF16-Hybrid-UCI"
          $exe=Join-Path $dir.Path "Searchless-SF16-Hybrid-UCI.exe"
          $psi=New-Object Diagnostics.ProcessStartInfo
          $psi.FileName=$exe
          $psi.WorkingDirectory=$dir.Path
          $psi.UseShellExecute=$false
          $psi.RedirectStandardInput=$true
          $psi.RedirectStandardOutput=$true
          $psi.RedirectStandardError=$true
          $psi.CreateNoWindow=$true
          $p=New-Object Diagnostics.Process
          $p.StartInfo=$psi
          $p.Start() | Out-Null
          $p.StandardInput.WriteLine("uci")
          $lines=@()
          while(($line=$p.StandardOutput.ReadLine()) -ne "uciok") { if($null -eq $line){throw "EOF"}; $lines += $line }
          $banner=$lines -join "`n"
          Write-Host $banner
          if($banner -notmatch "Backend type combo default CPU") { throw "Backend is not CPU by default" }
          $p.StandardInput.WriteLine("quit")
          $p.StandardInput.Close()
          $p.WaitForExit(10000) | Out-Null

      - name: Lucas-style first move with untouched defaults
        shell: pwsh
        run: |
          $dir=Resolve-Path "pkg/dist/Searchless-SF16-Hybrid-UCI"
          $exe=Join-Path $dir.Path "Searchless-SF16-Hybrid-UCI.exe"
          $psi=New-Object Diagnostics.ProcessStartInfo
          $psi.FileName=$exe
          $psi.WorkingDirectory=$dir.Path
          $psi.UseShellExecute=$false
          $psi.RedirectStandardInput=$true
          $psi.RedirectStandardOutput=$true
          $psi.RedirectStandardError=$true
          $psi.CreateNoWindow=$true
          $p=New-Object Diagnostics.Process
          $p.StartInfo=$psi
          $p.Start() | Out-Null
          function Send([string]$s){Write-Host ">> $s";$p.StandardInput.WriteLine($s);$p.StandardInput.Flush()}
          function ReadUntil([string]$pat,[int]$timeout=120000){
            $sw=[Diagnostics.Stopwatch]::StartNew()
            while($sw.ElapsedMilliseconds -lt $timeout){
              $line=$p.StandardOutput.ReadLine()
              if($null -eq $line){throw "EOF waiting $pat"}
              Write-Host "<< $line"
              if($line -match $pat){return $line}
            }
            throw "timeout"
          }
          Send "uci"; ReadUntil "^uciok$" 10000 | Out-Null
          Send "isready"; ReadUntil "^readyok$" 10000 | Out-Null
          Send "ucinewgame"
          Send "position startpos"
          Send "go wtime 5000 btime 5000 winc 0 binc 0"
          $bm=ReadUntil "^bestmove\s+[a-h][1-8][a-h][1-8][qrbn]?$" 120000
          Write-Host "FIRST_BESTMOVE=$bm"
          if($p.HasExited){throw "engine exited"}
          Send "quit"
          $p.StandardInput.Close()
          if(-not $p.WaitForExit(10000)){ $p.Kill(); throw "hang on quit" }
          $err=$p.StandardError.ReadToEnd()
          Write-Host "EXIT=$($p.ExitCode)"
          Write-Host "STDERR=$err"
          if($p.ExitCode -ne 0){throw "nonzero exit"}

      - name: Long-control plus stop test
        shell: pwsh
        run: |
          $dir=Resolve-Path "pkg/dist/Searchless-SF16-Hybrid-UCI"
          $exe=Join-Path $dir.Path "Searchless-SF16-Hybrid-UCI.exe"
          $psi=New-Object Diagnostics.ProcessStartInfo
          $psi.FileName=$exe
          $psi.WorkingDirectory=$dir.Path
          $psi.UseShellExecute=$false
          $psi.RedirectStandardInput=$true
          $psi.RedirectStandardOutput=$true
          $psi.RedirectStandardError=$true
          $psi.CreateNoWindow=$true
          $p=New-Object Diagnostics.Process
          $p.StartInfo=$psi
          $p.Start() | Out-Null
          $p.StandardInput.WriteLine("uci");$p.StandardInput.Flush()
          while(($line=$p.StandardOutput.ReadLine()) -ne "uciok"){if($null -eq $line){throw "EOF"}}
          $p.StandardInput.WriteLine("isready");$p.StandardInput.Flush()
          while(($line=$p.StandardOutput.ReadLine()) -ne "readyok"){if($null -eq $line){throw "EOF"}}
          $p.StandardInput.WriteLine("ucinewgame")
          $p.StandardInput.WriteLine("position startpos")
          $p.StandardInput.WriteLine("go wtime 5400000 btime 5400000 winc 0 binc 0")
          $p.StandardInput.Flush()
          Start-Sleep -Seconds 6
          if($p.HasExited){throw "engine exited during 90-minute-control search"}
          $p.StandardInput.WriteLine("stop");$p.StandardInput.Flush()
          $sw=[Diagnostics.Stopwatch]::StartNew();$best=$null
          while($sw.ElapsedMilliseconds -lt 30000){
            $line=$p.StandardOutput.ReadLine()
            if($null -eq $line){throw "EOF waiting bestmove after stop"}
            Write-Host "<< $line"
            if($line -match "^bestmove\s+"){$best=$line;break}
          }
          if(-not $best){throw "no bestmove after stop"}
          Write-Host "STOP_BESTMOVE=$best"
          $p.StandardInput.WriteLine("quit");$p.StandardInput.Close()
          if(-not $p.WaitForExit(10000)){ $p.Kill(); throw "hang on quit" }

      - name: Persistent 8-ply low-memory test
        shell: pwsh
        run: |
          @'
          import pathlib, subprocess, re, time, psutil
          root=pathlib.Path("pkg/dist/Searchless-SF16-Hybrid-UCI").resolve()
          exe=root/"Searchless-SF16-Hybrid-UCI.exe"
          p=subprocess.Popen([str(exe)],cwd=str(root),stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,bufsize=1)
          ps=psutil.Process(p.pid)
          def send(x):
              p.stdin.write(x+"\n"); p.stdin.flush()
          def until(rx,timeout=120):
              pat=re.compile(rx); end=time.monotonic()+timeout
              while time.monotonic()<end:
                  line=p.stdout.readline()
                  if line=="": raise RuntimeError(f"EOF rc={p.poll()} stderr={p.stderr.read()!r}")
                  line=line.rstrip()
                  if pat.match(line): return line
              raise TimeoutError(rx)
          send("uci"); until(r"^uciok$",10)
          send("isready"); until(r"^readyok$",10)
          moves=[]
          rss=[]
          for ply in range(1,9):
              if not moves: send("ucinewgame")
              send("position startpos"+((" moves "+" ".join(moves)) if moves else ""))
              send("isready"); until(r"^readyok$",30)
              send("go wtime 60000 btime 60000 winc 1000 binc 1000")
              bm=until(r"^bestmove\s+[a-h][1-8][a-h][1-8][qrbn]?$",120)
              mv=bm.split()[1]; moves.append(mv)
              m=ps.memory_info()
              rss.append(m.rss)
              print(f"PLY={ply} MOVE={mv} RSS={m.rss} VMS={m.vms} ALIVE={p.poll() is None}",flush=True)
              if p.poll() is not None: raise RuntimeError("engine exited")
          print(f"RSS_FIRST={rss[0]} RSS_MAX={max(rss)} RSS_LAST={rss[-1]}",flush=True)
          if max(rss) > 1350000000:
              raise RuntimeError(f"Low-memory target missed: max RSS {max(rss)}")
          send("quit"); p.stdin.close()
          rc=p.wait(timeout=15)
          err=p.stderr.read()
          print("FINAL_MOVES="+" ".join(moves))
          print("EXIT_CODE=",rc)
          print("STDERR=",repr(err))
          if rc: raise SystemExit(rc)
          '@ | Set-Content -Encoding UTF8 lowmem_test.py
          python lowmem_test.py

      - name: Verify diagnostic logs
        shell: pwsh
        run: |
          $dir="pkg/dist/Searchless-SF16-Hybrid-UCI"
          Get-Content "$dir/Searchless-Hybrid-debug.log" -Tail 50
          if(-not (Test-Path "$dir/Searchless-Hybrid-native-crash.log")) { throw "native crash log file missing" }

      - name: Add README
        shell: pwsh
        run: |
          @"
          Searchless + Stockfish16 HCE Hybrid 2.4 CPU-Safe

          This build uses CPUExecutionProvider by default and includes no DirectML runtime.
          Legacy Backend=Auto also maps to CPU. DirectML therefore falls back to CPU.
          Searchless 270M is bundled locally.
          Stockfish 16 HCE is embedded and NNUE is disabled.

          If the engine disappears, inspect:
          Searchless-Hybrid-debug.log
          Searchless-Hybrid-native-crash.log
          "@ | Set-Content -Encoding UTF8 "pkg/dist/Searchless-SF16-Hybrid-UCI/README_FIRST.txt"

      - name: Upload low-memory 270M-ready engine
        uses: actions/upload-artifact@v4
        with:
          name: Searchless-SF16-Hybrid-UCI-v2.5-LowMemory-270M
          path: pkg/dist/Searchless-SF16-Hybrid-UCI/
