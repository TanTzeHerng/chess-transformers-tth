name: Cassandre 30-second timing integrity audit
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: cassandre-timing-audit-only
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: experiments
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download original immutable puzzle dataset
        uses: actions/download-artifact@v4
        with:
          name: cassandre-2300-prepared
          run-id: 39586706185
          github-token: ${{ github.token }}
          path: dataset
      - name: Independently reconcile immutable artifacts without publishing scores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -u experiments/cassandre_puzzles_2300_recovery_prepare.py --dataset dataset/puzzles_2300.jsonl --out output --audit-partial
      - name: Audit recorded thinking times only
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          records=[]
          for path in sorted(Path('output/checkpoints').glob('shard-*.jsonl')):
              for line in path.read_text(encoding='utf8').splitlines():
                  if line.strip():records.append(json.loads(line))
          assert len(records)==len({r['index'] for r in records}), 'Duplicate scored index'
          assert len(records)==33425, f'Unexpected reconciliation count: {len(records)}'
          scored=[r for r in records if isinstance(r.get('solved'),bool)]
          assert len(scored)==33425, 'Unexpected invalid/unknown results'
          counters={str(t):0 for t in (30,30.5,31,35,40,60)}
          affected={str(t):[] for t in (30,30.5,31,35,40,60)}
          missing_times=0
          moves=0
          max_seconds=0.0
          for r in scored:
              times=[]
              for m in r.get('moves',[]):
                  seconds=m.get('seconds')
                  if not isinstance(seconds,(int,float)) or not math.isfinite(seconds):
                      missing_times+=1
                      continue
                  moves+=1
                  times.append(seconds)
                  max_seconds=max(max_seconds,seconds)
                  for threshold in (30,30.5,31,35,40,60):
                      if seconds>threshold:counters[str(threshold)]+=1
              for threshold in (30,30.5,31,35,40,60):
                  if any(s>threshold for s in times):affected[str(threshold)].append(r)
          summary={'source':'immutable verified Cassandre original and recovery puzzle artifacts',
              'mode':'audit-only; NO puzzle scores or engine settings modified',
              'resolved_records':len(records),'rated_records':len(scored),
              'recorded_solver_moves':moves,'missing_or_invalid_seconds':missing_times,
              'over_threshold_move_counts':counters,
              'over_threshold_puzzle_counts':{k:len(v) for k,v in affected.items()},
              'over_30_puzzles_scored_solved':sum(r['solved'] for r in affected['30']),
              'over_30_puzzles_scored_failed':sum(not r['solved'] for r in affected['30']),
              'over_31_puzzles_scored_solved':sum(r['solved'] for r in affected['31']),
              'over_31_puzzles_scored_failed':sum(not r['solved'] for r in affected['31']),
              'max_recorded_seconds':round(max_seconds,3),
              'sample_over_31':[{'index':r['index'],'id':r['id'],
                  'max_seconds':max(m.get('seconds',0) for m in r.get('moves',[])),
                  'currently_scored_solved':r['solved']} for r in affected['31'][:12]]}
          # Provisional sensitivity analysis only: do NOT alter the official scores.
          dataset=[json.loads(line) for line in Path('dataset/puzzles_2300.jsonl').read_text(encoding='utf8').splitlines() if line.strip()]
          assert len(dataset)==33460
          q=math.log(10)/400
          def provisional(cutoff):
              eligible=[r for r in scored if all(isinstance(m.get('seconds'),(int,float)) and math.isfinite(m['seconds']) and m['seconds']<=cutoff for m in r.get('moves',[]))]
              wins=sum(r['solved'] for r in eligible)
              losses=len(eligible)-wins
              expected=sum(1/(1+10**((float(dataset[r['index']]['rating'])-2500)/400)) for r in eligible)
              information=sum(q*q*e*(1-e) for e in (1/(1+10**((float(dataset[r['index']]['rating'])-2500)/400)) for r in eligible))
              precision=1/(350**2)+information
              return {'cutoff_seconds':cutoff,'rated':len(eligible),'solved':wins,'failed':losses,
                  'excluded_for_overrun':len(scored)-len(eligible),
                  'provisional_rating':2500+q*(wins-expected)/precision,
                  'provisional_rd':math.sqrt(1/precision),
                  'warning':'Diagnostic subset only; not a valid replacement for replaying timed-out puzzles'}
          summary['provisional_compliant_only_sensitivity']=[provisional(30),provisional(31)]
          # Immutable audit manifest only. Do not change existing puzzle scores.
          over30={r['index']:r for r in affected['30']}
          scored_indices={r['index'] for r in scored}
          pending_indices=set(range(len(dataset)))-scored_indices
          assert len(over30)==4116 and len(pending_indices)==35
          manifest=[]
          for idx in sorted(set(over30)|pending_indices):
              row=dataset[idx]
              if idx in over30:
                  r=over30[idx]
                  assert r['id']==row['id']
                  manifest.append({'index':idx,'id':r['id'],'rating':row['rating'],
                      'reason':'over_30_seconds','prior_scored_result_preserved':r['solved'],
                      'max_seconds':max(m['seconds'] for m in r['moves'])})
              else:
                  manifest.append({'index':idx,'id':row['id'],'rating':row['rating'],
                      'reason':'unscored_technical','prior_scored_result_preserved':None})
          assert len(manifest)==4151 and len({x['index'] for x in manifest})==4151
          Path('output/cassandre-strict30-replay-manifest.jsonl').write_text(
              ''.join(json.dumps(x,separators=(',',':'))+'\n' for x in manifest),encoding='utf8')
          summary['strict30_replay_manifest']={'total':len(manifest),
              'over30':len(over30),'unscored_technical':len(pending_indices),
              'note':'Audit-only replay candidates, no existing result modified'}
          out=Path('output/cassandre-time-integrity-audit.json')
          out.write_text(json.dumps(summary,indent=2),encoding='utf8')
          print('CASSANDRE_TIMING_INTEGRITY_AUDIT',json.dumps(summary),flush=True)
          PY
      - name: Preserve timing audit independently of production results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cassandre-time-integrity-audit
          path: |
            output/cassandre-time-integrity-audit.json
            output/cassandre-strict30-replay-manifest.jsonl
          retention-days: 30
          if-no-files-found: warn
